<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Google - Tort's Auto Peças</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,800;0,900;1,900&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      padding: 40px;
    }

    .btn-print {
      background: linear-gradient(135deg, #E31B23, #991218);
      color: white; border: none; padding: 12px 24px; border-radius: 8px;
      font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 14px;
      cursor: pointer; margin-bottom: 30px;
      box-shadow: 0 4px 15px rgba(227, 27, 35, 0.4);
      transition: all 0.2s;
    }
    
    .btn-print:hover {
      transform: translateY(-2px); box-shadow: 0 6px 20px rgba(227, 27, 35, 0.6);
    }

    /* A5 Banner Container */
    .banner {
      width: 420px; height: 594px; background: #ffffff;
      position: relative; overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* TOP SECTION */
    .top-section {
      width: 100%; padding: 35px 20px 0 20px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }

    .google-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .google-g-icon { width: 34px; height: 34px; }
    .google-text {
      font-family: 'Product Sans', 'Outfit', sans-serif;
      font-size: 38px; font-weight: 700; letter-spacing: -1px;
    }

    .stars { display: flex; gap: 6px; margin-bottom: 18px; }
    .star {
      width: 40px; height: 40px;
      filter: drop-shadow(0 4px 4px rgba(0,0,0,0.2));
    }

    .main-title {
      font-size: 24px; font-weight: 800; color: #1e293b;
      line-height: 1.25; margin-bottom: 8px;
    }
    .main-title .highlight { color: #0f172a; font-size: 26px; display: block; margin-top: 2px; }

    .subtitle { font-size: 13.5px; font-weight: 500; color: #475569; }

    /* BOTTOM SECTION */
    .bottom-section {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 45%;
      background-color: #000000;
      z-index: 1; clip-path: polygon(0 15%, 100% 0, 100% 100%, 0 100%);
    }

    /* SHARDS (Racing Stripes) */
    .red-shard-left {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #E31B23, #b91c1c);
      clip-path: polygon(0 35%, 20% 100%, 10% 100%, 0 45%); z-index: 1;
    }
    .red-shard-left-dark {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
      background: #E31B23;
      clip-path: polygon(0 55%, 8% 100%, 5% 100%, 0 60%); z-index: 1;
    }
    .red-shard-right {
      position: absolute; bottom: 0; right: 0; width: 100%; height: 100%;
      background: linear-gradient(225deg, #E31B23, #b91c1c);
      clip-path: polygon(100% 25%, 80% 100%, 90% 100%, 100% 35%); z-index: 1;
    }
    .red-shard-right-dark {
      position: absolute; bottom: 0; right: 0; width: 100%; height: 100%;
      background: #E31B23;
      clip-path: polygon(100% 45%, 92% 100%, 95% 100%, 100% 50%); z-index: 1;
    }

    /* FOOTER CONTENT */
    .footer-content {
      position: absolute; bottom: 25px; width: 100%;
      display: flex; flex-direction: column; align-items: center; z-index: 10;
      mix-blend-mode: screen;
    }

    .torts-img-logo {
      width: 220px;
      height: auto;
      margin-bottom: 8px;
    }

    .services-text { color: #cbd5e1; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
    .services-text span { color: #E31B23; margin: 0 5px; }
    .thanks-text { color: #ffffff; font-size: 15px; font-weight: 800; font-family: 'Montserrat', sans-serif; }

    /* QR CODE CONTAINER */
    .qr-container {
      position: absolute; top: 54%; left: 50%; transform: translate(-50%, -50%);
      width: 170px; background: #ffffff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4); z-index: 20; border: 4px solid #000;
      display: flex; flex-direction: column;
    }
    .qr-header {
      background: #000000; color: #ffffff; text-align: center;
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 12px;
      padding: 8px 0; letter-spacing: 1px;
    }
    .qr-body { background: #ffffff; padding: 12px; display: flex; align-items: center; justify-content: center; }
    .qr-image { width: 100%; height: 100%; object-fit: contain; }

    /* PRINT */
    @media print {
      body { background: none !important; padding: 0 !important; margin: 0 !important; display: block !important; }
      .no-print { display: none !important; }
      .banner {
        width: 148mm !important; height: 210mm !important; border-radius: 0 !important;
        box-shadow: none !important; margin: 0 !important;
      }
      @page { size: A5 portrait; margin: 0; }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <button class="btn-print" onclick="window.print()">Imprimir Banner (A5)</button>
  </div>

  <div class="banner">
    
    <div class="top-section">
      <div class="google-logo">
        <svg class="google-g-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <div class="google-text">
          <span style="color:#4285F4">G</span><span style="color:#EA4335">o</span><span style="color:#FBBC05">o</span><span style="color:#4285F4">g</span><span style="color:#34A853">l</span><span style="color:#EA4335">e</span>
        </div>
      </div>

      <div class="stars">
        <!-- Reusable 3D Star Definition -->
        <svg width="0" height="0">
          <defs>
            <linearGradient id="gold" x1="10%" y1="0%" x2="90%" y2="100%">
              <stop offset="0%" stop-color="#FFE066" />
              <stop offset="30%" stop-color="#FFC107" />
              <stop offset="70%" stop-color="#FF9800" />
              <stop offset="100%" stop-color="#F57C00" />
            </linearGradient>
            <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#FFF8E1" stop-opacity="0.9"/>
              <stop offset="45%" stop-color="#FFF8E1" stop-opacity="0"/>
              <stop offset="55%" stop-color="#3E2723" stop-opacity="0"/>
              <stop offset="100%" stop-color="#3E2723" stop-opacity="0.6"/>
            </linearGradient>
          </defs>
        </svg>
        <!-- Render 5 Stars -->
        <svg class="star" viewBox="0 0 24 24">
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#gold)" />
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#bevel)" />
        </svg>
        <svg class="star" viewBox="0 0 24 24">
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#gold)" />
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#bevel)" />
        </svg>
        <svg class="star" viewBox="0 0 24 24">
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#gold)" />
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#bevel)" />
        </svg>
        <svg class="star" viewBox="0 0 24 24">
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#gold)" />
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#bevel)" />
        </svg>
        <svg class="star" viewBox="0 0 24 24">
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#gold)" />
          <path d="M12,2 L15.09,8.26 L22,9.27 L17,14.14 L18.18,21.02 L12,17.77 L5.82,21.02 L7,14.14 L2,9.27 L8.91,8.26 Z" fill="url(#bevel)" />
        </svg>
      </div>

      <h1 class="main-title">
        Sua opinião é muito<br>
        importante!<br>
        <span class="highlight">Avalie-nos no Google</span>
      </h1>
      
      <p class="subtitle">Escaneie o código QR e deixe sua avaliação.</p>
    </div>

    <!-- CENTRAL QR CODE OVERLAY -->
    <div class="qr-container">
      <div class="qr-header">ESCANEIE AQUI</div>
      <div class="qr-body">
        <img src="qrcode_google.png" alt="QR Code Google" class="qr-image">
      </div>
    </div>

    <!-- BOTTOM SPORTY SECTION -->
    <div class="bottom-section">
      <div class="red-shard-left"></div>
      <div class="red-shard-left-dark"></div>
      <div class="red-shard-right"></div>
      <div class="red-shard-right-dark"></div>

      <div class="footer-content">
        <img src="logo_torts_novo.png" alt="Tort's Auto Peças" class="torts-img-logo">
        <div class="services-text">
          Acessórios <span>•</span> Peças <span>•</span> Serviços
        </div>
        <div class="thanks-text">
          Agradecemos sua visita!
        </div>
      </div>
    </div>

  </div>

</body>
</html>
